name: Download shared macOS Qt

on:
  workflow_call:
    inputs:
      release:
        description: Shared Qt release tag
        type: string
        default: qt-6.12.0-python-3.15-macos-14.4-v1
      artifact-name:
        description: Artifact name in the calling workflow
        type: string
        default: macOS-Qt-universal2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download published wheels and verify checksums
        env:
          GH_TOKEN: ${{ github.token }}
          QT_RELEASE: ${{ inputs.release || 'qt-6.12.0-python-3.15-macos-14.4-v1' }}
        run: |
          mkdir -p wheels
          gh release download "$QT_RELEASE" \
            --repo GoldenNugget-Team/QTBuildMacOS \
            --pattern '*.whl' --pattern SHA256SUMS.txt --dir wheels
          cd wheels
          sha256sum --check SHA256SUMS.txt
          test "$(find . -maxdepth 1 -name '*.whl' | wc -l)" -eq 2
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-name || 'macOS-Qt-universal2' }}
          path: wheels/*.whl
          if-no-files-found: error

